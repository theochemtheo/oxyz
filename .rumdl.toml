[global]
exclude = [
    ".git",
    ".github",
    "target",
    "build",
    "benchmarks/MEMORY.md",
    "benchmarks/RESULTS.md",
    # Keep the vendored font licence byte-for-byte.
    "docs/fonts/iosevka/LICENSE.md",
]
respect-gitignore = true
flavor = "gfm"

[per-file-flavor]
"docs/**/*.md" = "mkdocs"

[MD013]
code-blocks = false  # Exclude code blocks from line length check
