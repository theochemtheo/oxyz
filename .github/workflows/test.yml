name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
      - run: bash scripts/zizmor.sh
        env:
          GH_TOKEN: ${{ github.token }}

  pre-push-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay publishes `stable` as a force-pushed branch, so each Rust release
      # orphans this pin and zizmor fails until all five uses are re-pinned.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
      - run: uv sync --extra ase
      - run: uv run prek run --hook-stage pre-push --all-files

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.15 waits on cp315 wheels for h5py and numexpr (via torch-sim).
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
      - run: uv sync --extra ase
      # Fails the run if an optional dependency is missing rather than skipping.
      - run: uv run pytest
        env:
          OXYZ_TEST_TIER: full

  # Built once: the tiers need no Rust toolchain and test the wheel users get.
  build-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.12"
      - run: uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tier-wheel
          path: dist

  # Deliberately incomplete environments, so the optional-target import guards
  # run with their dependency absent. Tiers sit on the abi3 floor, except `base`
  # on the newest Python to check the wheel loads above it.
  tiers:
    # Keeps `sync` out of the generated check name.
    name: tiers (${{ matrix.tier }}, ${{ matrix.python }})
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: base
            python: "3.12"
            sync: ""
          - tier: ase
            python: "3.12"
            sync: "--extra ase"
          - tier: s3
            python: "3.12"
            sync: "--group s3-test --extra s3"
          - tier: base
            python: "3.15"
            sync: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tier-wheel
          path: dist
      # --no-install-project: cache-keys would otherwise rebuild the extension.
      - run: uv sync --no-default-groups --group test $SYNC_ARGS --no-install-project
        env:
          SYNC_ARGS: ${{ matrix.sync }}
      # --no-deps: the wheel must not pull in extras this tier omits.
      - run: uv pip install --no-deps dist/*.whl
      # --no-sync keeps the installed wheel; the empty addopts skip the doctests.
      - run: uv run --no-sync pytest tests -o addopts=""
        env:
          OXYZ_TEST_TIER: ${{ matrix.tier }}

  coverage:
    needs: [rust, python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.13"
      # The full set: the coverage floors are calibrated against it.
      - run: uv sync --extra ase
      - run: bash scripts/coverage.sh
        env:
          OXYZ_TEST_TIER: full
      - run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
      - name: Comment coverage on PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file coverage/summary.md

  # The one required check. Every job in this file must be in `needs`: a job
  # whose dependency fails reports as skipped, which this gate counts as passing.
  test-gate:
    needs:
      [zizmor, pre-push-suite, rust, python, build-wheel, tiers, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass or be skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "test job results: $results"
          for result in $results; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a test job did not pass ($result)"
                exit 1
                ;;
            esac
          done
