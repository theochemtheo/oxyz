[package]
name = "oxyz-core"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
compact_str = "0.8"
fast-float2 = "0.2.3"
flate2 = "1"
memchr = "2.8.1"
rayon = { version = "1", optional = true }
ruzstd = "0.8"
# Shortest round-trippable f64 formatting, so read -> write -> read is exact.
ryu = "1"
tar = { version = "0.4", default-features = false }
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = "0.7.0"
# ruzstd only decodes, so zstd fixtures are committed rather than encoded.
flate2 = "1"
proptest = "1.11.0"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bench]]
name = "parse"
harness = false
