[package]
name = "oxyz-core"
version = "1.4.0"
description = "Lossless extxyz parsing, writing, schemas and batching"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
compact_str = "0.10"
fast-float2 = "0.2.3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
memchr = "2.8.1"
rayon = { version = "1", optional = true }
ruzstd = "0.9"
# Shortest round-trippable f64 formatting, so read -> write -> read is exact.
ryu = "1"
tar = { version = "0.4", default-features = false }
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
criterion = "0.8.2"
# ruzstd only decodes, so zstd fixtures are committed rather than encoded.
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
proptest = "1.11.0"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[[bench]]
name = "parse"
harness = false
