[package]
name = "oxyz-py"
version = "1.4.0"
description = "Python bindings for the oxyz extxyz reader and writer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_rust"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
oxyz-core = { path = "../oxyz-core" }
ndarray = "0.17"
numpy = "0.30"
# abi3 excludes free-threaded builds, which get version-specific wheels instead.
pyo3 = { version = "0.30", features = ["abi3-py312"] }
