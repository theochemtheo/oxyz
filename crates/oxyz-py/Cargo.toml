[package]
name = "oxyz-py"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "_rust"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
oxyz-core = { path = "../oxyz-core" }
ndarray = "0.17"
numpy = "0.28"
# abi3 means one wheel per platform, but none for free-threaded builds.
pyo3 = { version = "0.28", features = ["abi3-py312"] }
