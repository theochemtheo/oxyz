[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "oxyz"
version = "1.1.0"
description = "Fast, schema-aware extxyz reading for atomistic machine-learning workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Theo Keane" }]
keywords = [
    "extxyz",
    "xyz",
    "atomistic",
    "machine-learning",
    "materials",
    "chemistry",
    "ase",
    "parser",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/theochemtheo/oxyz"
Issues = "https://github.com/theochemtheo/oxyz/issues"

[project.scripts]
oxyz = "oxyz._cli:main"

[project.optional-dependencies]
# >=3.23: the first ase with set_calc_and_arrays and numpy 2 support; the
# oxyz.ase golden tests pass from 3.23 up. <4: ASEv4 may change the data
# model; new majors are opted into deliberately.
ase = ["ase>=3.23,<4"]
# torch>=2: the metatomic.torch System API and stable torch.from_numpy
# semantics oxyz.metatomic relies on. CPU wheels are pinned via the uv index
# below so CI never pulls a CUDA build.
metatomic = ["torch>=2", "metatomic-torch"]
# torch>=2 for the tensor API; torch-sim-atomistic is the PyPI name of the
# `torch_sim` package whose `SimState` oxyz.torch_sim targets. Heavier than the
# other extras (it pulls h5py/tables); only installed when this target is used.
torch-sim = ["torch>=2", "torch-sim-atomistic"]
# obstore is the only runtime dep for remote reading; kept optional so the base
# install stays numpy-only. Floor: 0.11, first release with stable get().stream()
# and provider config TypedDicts used by this library.
s3 = ["obstore>=0.11"]

[dependency-groups]
# Benchmark dependencies live in benchmarks/run.py (PEP 723), not here:
# the comparison parsers need CPython <3.14, which that script pins.
dev = [
    "ase>=3.28.0",
    "matplotlib>=3.10.9",
    "maturin>=1.13.3",
    "metatomic-torch",
    "boto3>=1.35",
    "moto[s3,server]>=5",
    "mypy>=1.13",
    "obstore>=0.11",
    "prek>=0.4.11",
    "pytest>=9.0.3",
    "pytest-cov>=6",
    "ruff>=0.16.0",
    "rumdl>=0.2.45",
    "seaborn>=0.13.2",
    "torch>=2",
    "torch-sim-atomistic",
    "types-pyyaml",
    "ty>=0.0.64",
]

[tool.uv]
# Pinned exactly, and matched by the `version:` on every setup-uv step: the
# lockfile is written by one uv version, so CI must not float onto another.
required-version = "==0.12.0"
# Pull torch from PyPI's CPU index everywhere except macOS, whose PyPI wheels
# are already CPU-only; this keeps Linux/Windows CI off the default CUDA build.
sources = { torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
] }
# Rebuild the editable extension (release, via maturin PEP517) whenever the
# Rust sources change, so `uv run` never tests or benchmarks a stale build.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
# ruff formats Python code blocks in Markdown. The README's blocks align their
# trailing comments into columns to be read as a table; the formatter collapses
# that alignment. Anchored with `./`: a bare `README.md` matches by basename and
# would quietly exempt the fixture READMEs under tests/data/ as well.
extend-exclude = ["./README.md"]

[tool.ruff.lint]
# Everything on, then opted out of deliberately. Each entry below is a decision
# with a reason attached, which a hand-picked select list cannot express: a rule
# absent from such a list might have been rejected, or might simply never have
# been read. ruff is pinned in uv.lock, so a new release's rules arrive on a
# deliberate bump rather than by surprise.
select = ["ALL"]
ignore = [
    "COM812",  # trailing commas are the formatter's business, not the linter's
    "ISC001",  # ditto: single-line implicit string concatenation
    "CPY001",  # the licence lives in LICENSE-*, not atop every file
    "PLC0415", # imports inside functions are how the optional targets stay optional
    "TRY003",  # the message at the raise site is the error's documentation
    "EM101",   # ditto: a literal there reads better than a name bound above it
    "EM102",   # ditto, for f-strings
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# lazy imports are the deliberate optional-target design; asserts and magic
# values are the idiom of these tests, not a smell.
# S: security lints target shipped code, not the test harness (fake creds, the
# ty subprocess canary); PT011: these tests assert the error class deliberately.
# D: docstring rules target the shipped public surface, not tests.
# FBT: the _rust extension's PyO3 signatures take their flags positionally.
"tests/**" = ["ANN", "S", "PLR2004", "SLF001", "ARG", "PT011", "D", "FBT"]
# print() is the CLI's output mechanism.
"src/oxyz/_cli.py" = ["T201"]
# the obstore adapter is the boundary to an optional, loosely-typed dependency;
# Any is deliberate there rather than a missing annotation.
"src/oxyz/_remote.py" = ["ANN401"]
# `format` is ASE's own keyword argument; shadowing the builtin is what makes
# oxyz.ase.read a drop-in for ase.io.read.
"src/oxyz/ase.py" = ["A002"]
# the .pyi stubs are the user-facing docs for the Rust extension's symbols, so
# they carry docstrings by design; pydocstyle rules do not apply to stubs.
"**/*.pyi" = ["PYI021", "D"]
# benchmarks are PEP 723 measurement scripts, not shipped surface: they print
# results, use pickle/random/subprocess to drive comparisons, and need no
# annotations or docstrings. Keep the real checks (F/E/B/…); relax the
# standards groups. They also reach into private module state to report on it,
# and carry the plotting flags and axis sizes of throwaway analysis code.
"benchmarks/**" = [
    "ANN",
    "S",
    "T20",
    "INP",
    "PT",
    "TC",
    "RUF001",
    "D",
    "ARG",
    "SLF001",
    "FBT",
    "PLR2004",
]
# utility scripts print their results and are not an importable package.
"scripts/**" = ["T20", "INP", "D"]
# doc examples print their output for a reader to eyeball and are not an
# importable package; their module docstring is the doc, mirroring scripts/**.
"examples/**" = ["T20", "INP", "D"]

[tool.pytest.ini_options]
# `--doctest-modules` collects the doctests in `src/oxyz`. The output-target
# doctests (oxyz.metatomic, oxyz.torch_sim) import torch, so they need the `dev`
# group's torch stack installed — the default `uv sync` provides it; a run under
# `uv sync --no-default-groups` would error on those imports rather than skip.
# They read `examples/data/` via the absolute `DATA` path injected by
# src/oxyz/conftest.py, so they resolve regardless of the working directory.
testpaths = ["tests", "src/oxyz"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source = ["oxyz"]
branch = true
omit = ["*/oxyz/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(?:typing\\.)?overload",
]

[tool.coverage.html]
directory = "htmlcov/python"

[tool.coverage.lcov]
output = "coverage/python.lcov"

[tool.maturin]
manifest-path = "crates/oxyz-py/Cargo.toml"
module-name = "oxyz._rust"
python-source = "src"
features = ["extension-module"]
# conftest.py is test-only (it provides the doctest `DATA` fixture); keep it out
# of the built sdist/wheel.
exclude = ["src/oxyz/conftest.py"]
