[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "oxyz"
version = "1.2.0"
description = "Fast, schema-aware extxyz reading for atomistic machine-learning workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Theo Keane" }]
keywords = [
    "extxyz",
    "xyz",
    "atomistic",
    "machine-learning",
    "materials",
    "chemistry",
    "ase",
    "parser",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/theochemtheo/oxyz"
Issues = "https://github.com/theochemtheo/oxyz/issues"

[project.scripts]
oxyz = "oxyz._cli:main"

[project.optional-dependencies]
# 3.23: set_calc_and_arrays and numpy 2. ase 4 may change the data model.
ase = ["ase>=3.23,<4"]
metatomic = ["torch>=2", "metatomic-torch"]
# torch-sim-atomistic provides the `torch_sim` package.
torch-sim = ["torch>=2", "torch-sim-atomistic"]
# 0.11 stabilises get().stream() and the provider config TypedDicts.
s3 = ["obstore>=0.11"]

[dependency-groups]
# Benchmark dependencies are pinned in benchmarks/run.py (PEP 723).
# `test` and `s3-test` stand apart from `dev` so CI tiers can omit the extras.
test = ["pytest>=9.0.3", "pytest-cov>=6"]
# obstore comes from the `s3` extra, as a user would install it.
s3-test = ["boto3>=1.35", "moto[s3,server]>=5"]
dev = [
    "ase>=3.28.0",
    "matplotlib>=3.10.9",
    "maturin>=1.13.3",
    "metatomic-torch",
    "mypy>=1.13",
    "obstore>=0.11",
    "prek>=0.4.11",
    "ruff>=0.16.0",
    "rumdl>=0.2.45",
    "seaborn>=0.13.2",
    "torch>=2",
    "torch-sim-atomistic",
    "types-pyyaml",
    "ty>=0.0.64",
    { include-group = "test" },
    { include-group = "s3-test" },
]

[tool.uv]
# Keep in step with `version:` on every setup-uv step.
required-version = "==0.13.0"
sources = { torch = { index = "pytorch-cpu" } }
# Rebuild the extension whenever the Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
# The formatter would collapse the README's column-aligned code comments. `./`
# stops a basename match exempting the READMEs under tests/data/.
extend-exclude = ["./README.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing commas are the formatter's business, not the linter's
    "ISC001",  # ditto: single-line implicit string concatenation
    "CPY001",  # the licence lives in LICENSE-*, not atop every file
    "PLC0415", # imports inside functions are how the optional targets stay optional
    "TRY003",  # the message at the raise site is the error's documentation
    "EM101",   # ditto: a literal there reads better than a name bound above it
    "EM102",   # ditto, for f-strings
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# FBT: the _rust extension's PyO3 signatures take their flags positionally.
"tests/**" = ["ANN", "S", "PLR2004", "SLF001", "ARG", "PT011", "D", "FBT"]
"src/oxyz/_cli.py" = ["T201"]
# obstore is loosely typed.
"src/oxyz/_remote.py" = ["ANN401"]
# `format` mirrors ase.io.read's signature.
"src/oxyz/ase.py" = ["A002"]
"**/*.pyi" = ["PYI021", "D"]
"benchmarks/**" = [
    "ANN",
    "S",
    "T20",
    "INP",
    "PT",
    "TC",
    "RUF001",
    "D",
    "ARG",
    "SLF001",
    "FBT",
    "PLR2004",
]
"scripts/**" = ["T20", "INP", "D"]
"examples/**" = ["T20", "INP", "D"]

[tool.pytest.ini_options]
# The doctests need every optional target installed; the CI tiers skip them.
testpaths = ["tests", "src/oxyz"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source = ["oxyz"]
branch = true
omit = ["*/oxyz/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(?:typing\\.)?overload",
]

[tool.coverage.html]
directory = "htmlcov/python"

[tool.coverage.lcov]
output = "coverage/python.lcov"

[tool.maturin]
manifest-path = "crates/oxyz-py/Cargo.toml"
module-name = "oxyz._rust"
python-source = "src"
features = ["extension-module"]
exclude = ["src/oxyz/conftest.py"]
